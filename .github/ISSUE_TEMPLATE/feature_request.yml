name: Feature Request
description: Suggest a new feature or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: checkboxes
    attributes:
      label: Existing Issue Check
      description: Please search existing issues first.
      options:
        - label: I have searched existing issues
          required: true

  - type: textarea
    attributes:
      label: Feature Description
      description: Describe the feature you'd like.
      placeholder: Describe the feature...
    validations:
      required: true

  - type: textarea
    attributes:
      label: Problem It Solves
      description: What problem does this feature address?
      placeholder: Describe the problem...
    validations:
      required: true

  - type: textarea
    attributes:
      label: Proposed Solution
      description: How do you think this should work?
      placeholder: Describe your solution...
    validations:
      required: false

  - type: textarea
    attributes:
      label: Alternatives Considered
      description: Any other solutions you considered?
      placeholder: Describe alternatives...
    validations:
      required: false

  - type: textarea
    attributes:
      label: Additional Context
      description: Any other relevant info, mockups, or examples.
      placeholder: Add context...
    validations:
      required: false
