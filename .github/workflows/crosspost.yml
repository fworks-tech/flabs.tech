name: Cross-post to Dev.to

on:
  workflow_dispatch:
    inputs:
      slug:
        description: "Post slug to publish (empty = all published posts without a Dev.to id)"
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - "src/content/blog/**"

permissions:
  contents: write
  actions: read

jobs:
  crosspost:
    # The devtoId commit-back below re-triggers this workflow for the bot
    # commit; skip it so the pipeline runs once per change.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm install

      - name: Cross-post to Dev.to
        run: npm run crosspost:devto
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
          CROSSPOST_SLUG: ${{ inputs.slug }}

      - name: Commit Dev.to ids back to frontmatter
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/content/blog
          if git diff --cached --quiet; then
            echo "No frontmatter changes to commit."
          else
            git commit -m "chore(blog): record Dev.to cross-post ids"
            git push
          fi
